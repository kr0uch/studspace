events {
    worker_connections 1024;
}

http {
    client_max_body_size 2m;
    server_tokens off;

    upstream studspace_server {
        server studspace_server:8080;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=studspace_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        location /api/v1/ {
            limit_req zone=studspace_limit burst=50 nodelay;

            proxy_pass         http://studspace_server;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;
        }

        location / {
            return 404;
        }
    }
}
