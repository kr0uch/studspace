services:
  postgres:
    image: postgres:17-alpine
    container_name: studspace_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  migrate:
    image: migrate/migrate:latest
    container_name: studspace_migrate
    env_file:
      - .env
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  studspace_server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.server
    image: studspace:latest
    container_name: studspace_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
    volumes:
      - .yaml:/app/.yaml:ro
      - ./logs:/app/logs
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: studspace_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      studspace_server:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
